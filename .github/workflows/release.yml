name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: macos-13
            dart_arch: x64
          - os: darwin
            arch: arm64
            runner: macos-14
            dart_arch: arm64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            dart_arch: x64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            dart_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          architecture: ${{ matrix.dart_arch }}

      - run: dart pub get

      - name: Run tests
        run: dart test

      - name: Compile native executable
        run: |
          dart compile exe example/example.dart \
            -o dart_tensor_preprocessing_${{ matrix.os }}_${{ matrix.arch }}

      - name: Create archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE_NAME="dart_tensor_preprocessing_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          tar czf "${ARCHIVE_NAME}" \
            dart_tensor_preprocessing_${{ matrix.os }}_${{ matrix.arch }} \
            README.md \
            LICENSE \
            CHANGELOG.md
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Generate SHA256 checksum
        run: |
          if [[ "${{ matrix.os }}" == "darwin" ]]; then
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd artifacts
          cat *.sha256 | sort > checksums.txt
          echo "=== checksums.txt ==="
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
